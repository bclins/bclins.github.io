<html xmlns="http://www.w3.org/1999/xhtml" lang="" xml:lang="">
<head>
  <meta charset="utf-8" />

  <title>Side by Side Boxplots</title>
  <style>
    code{white-space: pre-wrap;}
    span.smallcaps{font-variant: small-caps;}
    div.columns{display: flex; gap: min(4vw, 1.5em);}
    div.column{flex: auto; overflow-x: auto;}
    div.hanging-indent{margin-left: 1.5em; text-indent: -1.5em;}
    ul.task-list{list-style: none;}
    ul.task-list li input[type="checkbox"] {
      width: 0.8em;

      vertical-align: middle;
    }

  <link rel="stylesheet" href="" />

    <script src="//cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv-printshiv.min.js"></script>
  <![endif]-->
</head>
<body>
<header id="title-block-header">
<h1 class="title">Side by Side Boxplots</h1>
</header>
<form id="myForm">
<textarea id="myArea1" cols="60" rows="10"></textarea>
 
<textarea id="myArea2" cols="60" rows="10"></textarea>
<input type="button" id="myButton" value = "Enter"> <br>
</form>
<div id="boxDiv">

</div>
<script>
const cleanData = (inputString) => 
  inputString.replace(/^\s\s*/, '').replace(/\s\s*$/, '').split(/[\s,;]+/).map(Number);


let makeBoxplots = (data1,data2) => {
  var trace1 = {
    x: data1,
    type: 'box',
    name: "Group 1",
    marker: {
      color: "blue",
      line: {
        color: "blue",
        width: 1
      }
    }
  };

  var trace2 = {
    x: data2,
    type: 'box',
    name: "Group 2",
    marker: {
      color: "red",
      line: {
        color: "red",
        width: 1
      }
    }
  };
  
  var data = [trace2,trace1];

  var layout = {
    title: 'Title',
    width: 800,
    height: 400, 
    xaxis: {
      title: "Outcome"
    },
    yaxis: {
      title: ""
    },
    legend:{'traceorder':'reversed'}
  };

  try {
    return Plotly.newPlot('boxDiv', data, layout, {editable: true});
  } catch (_error) {}
};

window.onload = () => {
  document.getElementById("myButton").onclick = function() {
    let form = document.getElementById("myForm");
    let data1 = cleanData(form.myArea1.value);
    let data2 = cleanData(form.myArea2.value);
    makeBoxplots(data1,data2);
  }
};


</script>
</body>
